version: 2

project_name: bbox

before:
  hooks:
    - ./scripts/setup-libseccomp-cross.sh linux_arm64

builds:
  - id: bbox-amd64
    main: ./cmd/bbox
    binary: bbox
    env:
      - CGO_ENABLED=1
      - CC=cc
    goos:
      - linux
    goarch:
      - amd64
  - id: bbox-arm64
    main: ./cmd/bbox
    binary: bbox
    env:
      - CGO_ENABLED=1
      - CC=aarch64-linux-gnu-gcc
      - PKG_CONFIG_PATH={{ .Env.PROJECT_ROOT }}/.goreleaser-sysroot/linux_arm64/lib/pkgconfig
      - PKG_CONFIG_LIBDIR={{ .Env.PROJECT_ROOT }}/.goreleaser-sysroot/linux_arm64/lib/pkgconfig
    goos:
      - linux
    goarch:
      - arm64

archives:
  - id: bbox-bundle-amd64
    ids:
      - bbox-amd64
    name_template: "{{ .ProjectName }}_{{ .Version }}_linux_amd64"
    formats:
      - tar.gz
    files:
      - none*
  - id: bbox-bundle-arm64
    ids:
      - bbox-arm64
    name_template: "{{ .ProjectName }}_{{ .Version }}_linux_arm64"
    formats:
      - tar.gz
    files:
      - none*

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

release:
  prerelease: auto
