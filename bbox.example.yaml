# Copy this file to the root of a `github.com/moolen/spectre` checkout as `bbox.yaml`.
# Then run `bbox -- docker build .` from that checkout.
#
# This example is tuned for the spectre Dockerfile in transparent mode so all
# build egress stays inside the bwrap netns and is policed by bbox MITM.
# Use transparent mode when you do not fully control the upstream Dockerfile or
# you need non-proxy-aware clients to keep working. If every networked RUN step
# is proxy-aware, you can switch this to `proxy`; direct-socket clients will
# then fail closed by design.

name: spectre-builder
workdir: .

env:
  - PATH=/usr/local/bin:/usr/bin:/bin

clear_env: false
traffic_mode: transparent
policy_mode: enforce
# traffic_mode: proxy
access_log: json
report_policy_violations: true
report_access_summary: true
report_request_summary: true

docker_build:
  enabled: true
  # Optional explicit host tool overrides:
  # buildkitd_path: /usr/bin/buildkitd
  # buildctl_path: /usr/bin/buildctl
  # runc_path: /usr/bin/runc
  # podman_path: /usr/bin/podman
  # newuidmap_path: /usr/bin/newuidmap
  # newgidmap_path: /usr/bin/newgidmap

policy:
  rules:
    - host_patterns:
        - "^auth[.]docker[.]io$"
    - host_patterns:
        - "^auth[.]docker[.]io$"
      connect_ports:
        - "443"

    - host_patterns:
        - "^index[.]docker[.]io$"
    - host_patterns:
        - "^index[.]docker[.]io$"
      connect_ports:
        - "443"

    - host_patterns:
        - "^registry-1[.]docker[.]io$"
    - host_patterns:
        - "^registry-1[.]docker[.]io$"
      connect_ports:
        - "443"

    - host_patterns:
        - "^docker-images-prod[.]6aa30f8b08e16409b46e0173d6de2f56[.]r2[.]cloudflarestorage[.]com$"
    - host_patterns:
        - "^docker-images-prod[.]6aa30f8b08e16409b46e0173d6de2f56[.]r2[.]cloudflarestorage[.]com$"
      connect_ports:
        - "443"

    - host_patterns:
        - "^dl-cdn[.]alpinelinux[.]org$"
    - host_patterns:
        - "^dl-cdn[.]alpinelinux[.]org$"
      connect_ports:
        - "443"

    - host_patterns:
        - "^github[.]com$"
    - host_patterns:
        - "^github[.]com$"
      connect_ports:
        - "443"

    - host_patterns:
        - "^release-assets[.]githubusercontent[.]com$"
    - host_patterns:
        - "^release-assets[.]githubusercontent[.]com$"
      connect_ports:
        - "443"

    - host_patterns:
        - "^proxy[.]golang[.]org$"
    - host_patterns:
        - "^proxy[.]golang[.]org$"
      connect_ports:
        - "443"

    - host_patterns:
        - "^registry[.]npmjs[.]org$"
    - host_patterns:
        - "^registry[.]npmjs[.]org$"
      connect_ports:
        - "443"

    - host_patterns:
        - "^sum[.]golang[.]org$"
    - host_patterns:
        - "^sum[.]golang[.]org$"
      connect_ports:
        - "443"

    - host_patterns:
        - "^storage[.]googleapis[.]com$"
    - host_patterns:
        - "^storage[.]googleapis[.]com$"
      connect_ports:
        - "443"
