name: from-file
workdir: /workspace
bin: [bash, curl]
mounts:
  - type: bind
    source: /etc/ssl/certs
    target: /etc/ssl/certs
    read_only: true
  - type: bind
    source: /host/cache
    target: /cache
env:
  - FOO=bar
copy_env:
  - HOME
  - SSH_AUTH_SOCK
traffic_mode: transparent
policy_mode: audit
max_request_body_bytes: 12345
access_log: off
report_policy_violations: true
report_access_summary: true
report_request_summary: false
policy:
  rules:
    - host_patterns:
        - "^api[.]example[.]com$"
      http_methods:
        - post
