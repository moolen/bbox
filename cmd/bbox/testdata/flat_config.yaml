name: from-file
workdir: /workspace
bin: [bash, curl]
mount_ro:
  - /etc/ssl/certs:/etc/ssl/certs
mount_rw:
  - /host/cache:/cache
env:
  - FOO=bar
clear_env: true
traffic_mode: transparent
policy_mode: audit
max_request_body_bytes: 12345
access_log: off
report_policy_violations: true
report_access_summary: true
report_request_summary: false
policy:
  rules:
    - host_patterns:
        - "^api[.]example[.]com$"
      http_methods:
        - post
